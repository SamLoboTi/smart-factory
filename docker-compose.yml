version: '3.8'

services:
  # 1. CORE SIMULATION (Python)
  python-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-factory-core
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    environment:
      - DATABASE_PATH=/app/data/smart_factory.db
      - PYTHONPATH=/app
    restart: unless-stopped
    tty: true

  # 2. BACKEND API (NestJS + Python Bridge)
  backend:
    build:
      context: .
      dockerfile: platform/Dockerfile
    container_name: smart-factory-api
    ports:
      - "3002:3000"
    volumes:
      - ./data:/app/data
      - ./secure-data:/app/secure-data
      - ./src:/app/src # Mount src so changes in python logic reflect immediately
      - ./platform:/app/platform # Mount for dev (strictly speaking requires dev start command)
      - /app/platform/node_modules
    environment:
      - DATABASE_PATH=/app/data/smart_factory.db
      - NOTIFICATION_DATABASE_PATH=/app/secure-data/notification_config.db
      - NOTIFICATION_ENCRYPTION_KEY=${NOTIFICATION_ENCRYPTION_KEY:-change-this-dev-key}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_WHATSAPP_NUMBER=${TWILIO_WHATSAPP_NUMBER:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5174}
      - CORS_TUNNEL_ORIGINS=${CORS_TUNNEL_ORIGINS:-}
    depends_on:
      - python-core

  # 3. FRONTEND (Vite React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart-factory-ui
    ports:
      - "5174:5173"
    volumes:
      - ./frontend/src:/app/src # Hot Reload
      - ./frontend/public:/app/public
    environment:
      - VITE_PROXY_TARGET=http://backend:3000
      - VITE_ENABLE_TUNNEL=true
      - VITE_ALLOWED_HOSTS=${VITE_ALLOWED_HOSTS:-}
    depends_on:
      - backend

  # 4. PUBLIC TUNNEL (Cloudflare Quick Tunnel)
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: smart-factory-tunnel
    command: tunnel --no-autoupdate --url http://frontend:5173
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  data:
  secure-data:
